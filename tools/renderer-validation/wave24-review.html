<style>body{margin:0;overflow:hidden!important;background:#203a3b;color:#fff;font:14px system-ui}header{position:absolute;z-index:10;background:#243b38ee;padding:8px;display:flex;gap:6px;align-items:center;width:100%;box-sizing:border-box}header button{padding:7px;font-size:11px;color:#152822}#battlefield{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important}#result{white-space:pre;position:absolute;right:0;bottom:0;background:#132b29dd;padding:10px;pointer-events:none;max-width:290px;max-height:45vh;overflow:hidden;font-size:10px}</style>

<header><b>Controlled render review · no scores</b><button id="combat">Run active 5× combat</button><button data-wave="24">Wave 24 · 30 enemies</button><button data-wave="46">Wave 46 · 30 enemies</button><button id="corpses">Settle 20 corpses</button><button id="motion">Animate frozen layout</button><button data-craft="dw_griffinscout">Prepare Griffin Scout</button><button data-craft="dw_steamrail">Prepare Heavy Sniper</button><button data-craft="dw_breachorgan">Prepare Gatling Golem</button><button id="craft" disabled>Craft prepared champion</button><span id="status">Choose a scene</span></header><aside class="sidebar" hidden><div class="side-body"></div></aside><div id="battlefield"></div><output id="result"></output>
<script type="module">
import{approvedMotionController}from'/game/render/approved-model-motion.js';import {Game}from'/game/core/game.js';import{Battlefield}from'/game/render/world.js';import{withTowerStatSnapshot}from'/game/core/math.js';import{createFactionData}from'/game/core/factions.js';import{applyFr002Registry}from'/game/core/fr002-registry.js';import{applyFr003Registry}from'/game/core/fr003-registry.js';import{applyFr004Registry}from'/game/core/fr004-registry.js';import{applyFr005Registry}from'/game/core/fr005-registry.js';import{campaignTowers,campaignRecipes,campaignEnemies,campaignWaves}from'/game/core/campaign-roster.js';import{preparedBlueprints}from'/game/core/blueprints.js';
const json=async p=>(await fetch('/'+p)).json(),raw=Object.fromEntries(await Promise.all(['balance','towers','recipes','enemies','waves'].map(async k=>[k,await json('data/'+k+'.json')]))),current={...raw,towers:campaignTowers(raw.towers),recipes:campaignRecipes(raw.recipes),enemies:campaignEnemies(raw.enemies),waves:campaignWaves(raw.waves)},registry=applyFr005Registry(applyFr004Registry(applyFr003Registry(applyFr002Registry(await json('data/factions-v060.json'))))),data=createFactionData(current,registry,'forge'),army=(await json('tools/fr005-validation/controlled/fixed-inputs.json')).cohorts.current.find(c=>c.faction==='forge').army,diamond=preparedBlueprints(await json('data/maze-blueprints.json')).find(p=>p.id==='diamond-spiral'),positions=[...diamond.core].sort((a,b)=>a.z-b.z||a.x-b.x);
const profiled=new WeakSet(),stageRows=[];let stage={};function timed(object,key,label){if(!object||profiled.has(object[key]))return;const original=object[key];const wrapped=function(...args){const started=performance.now();try{return original.apply(this,args);}finally{stage[label]=(stage[label]||0)+performance.now()-started;}};profiled.add(wrapped);object[key]=wrapped;}function profile(){timed(world.renderer,"render","draw");for(const f of world.enemies.values()){const c=approvedMotionController(f.userData.body);if(!c)continue;timed(c.motion,"update","fields");timed(c.runtimeRig,"copyPoseFrom","copies");timed(c.dynamicBatching,"sync","batches");timed(c.dynamicBatching,"shareFrom","shares");}}let game,world,settling=false,animating=false,activeCombat=false,craftTarget=null,craftReview=null,previous=performance.now();const status=document.querySelector('#status'),result=document.querySelector('#result');
async function load(wave){animating=false;activeCombat=false;craftTarget=null;craftReview=null;world?.dispose();document.querySelector('#battlefield').replaceChildren();game=new Game(data,{seed:910001,waveLimit:50});game.round=wave;game.developerMode=true;game.phase='combat';game.paused=true;game.combat.spawnQueue=[{time:99999,type:'host_24'}];
 for(const[i,p]of diamond.walls.entries())game.grid.occupy(p.x,p.z,i+1);game.towers=diamond.walls.map((p,i)=>({id:i+1,state:'ruin',family:'dw_shieldguard',tier:1,...p,kills:0,cooldown:0,mvpLevel:0}));for(const[a,i]of army.map((a,i)=>[a,i]))Object.assign(game.towers.find(t=>t.x===positions[i].x&&t.z===positions[i].z),a,{state:'active',attackPaused:true});
 const route=game.grid.route,type='host_'+String(wave).padStart(2,'0');for(let i=0;i<30;i++){const enemy=game.combat.spawn(type),index=Math.floor(route.length*(.1+i*.022));Object.assign(enemy,{x:route[index].x,z:route[index].z,route,pathIndex:index,traveled:index,hp:1e8,maxHp:1e8});}game.combat.total=30;world=new Battlefield(document.querySelector('#battlefield'),game,()=>{});status.textContent='Loading native models';document.body.dataset.scene=String(wave);await world.loadAssets();}
document.querySelector('#combat').onclick=()=>{if(!game||game.phase!=='combat')return;activeCombat=true;animating=false;game.speed=5;game.paused=false;for(const t of game.towers)t.attackPaused=false;for(const e of game.combat.enemies)e.hp=e.maxHp=data.enemies[e.type].hp;};for(const button of document.querySelectorAll('[data-wave]'))button.onclick=()=>load(Number(button.dataset.wave));document.querySelector('#corpses').onclick=()=>{if(!world||world.enemies.size!==30)return;for(const enemy of game.combat.enemies.slice(0,20)){enemy.dead=true;game.emit('death',{enemy});}game.combat.enemies=game.combat.enemies.filter(e=>!e.dead);game.paused=false;settling=true;};
async function prepareCraft(id){world?.dispose();document.querySelector('#battlefield').replaceChildren();settling=false;activeCombat=false;animating=false;craftReview=null;craftTarget=id;game=new Game(data,{seed:910001,waveLimit:50});game.round=24;game.developerMode=true;game.phase='ready';game.paused=true;for(const[i,p]of diamond.walls.entries())game.grid.occupy(p.x,p.z,i+1);game.towers=diamond.walls.map((p,i)=>({id:i+1,state:'ruin',family:'dw_shieldguard',tier:1,...p,kills:0,cooldown:0,mvpLevel:0}));const recipe=game.recipes.find(r=>r.id===id);for(let i=0;i<2;i++)Object.assign(game.towers.find(t=>t.x===positions[i].x&&t.z===positions[i].z),recipe.ingredients[i],{state:'active'});game.selected=game.towers.find(t=>t.state==='active').id;world=new Battlefield(document.querySelector('#battlefield'),game,()=>{});document.body.dataset.scene=id;status.textContent='Preparing target from two visible ingredients';await world.loadAssets();}
for(const b of document.querySelectorAll('[data-craft]'))b.onclick=()=>prepareCraft(b.dataset.craft);document.querySelector('#craft').onclick=()=>{const before=world.imported.has(craftTarget+':1'),r=game.recipes.find(r=>r.id===craftTarget),t=game.towers.find(t=>t.x===positions[2].x&&t.z===positions[2].z);Object.assign(t,r.ingredients[2],{state:'active'});game.emit('change');const started=performance.now(),ok=game.craft(craftTarget),model=world.models.get(game.selected);craftReview={target:craftTarget,warmedBeforeFinalIngredient:before,crafted:ok,immediateModelStatus:model?.modelStatus,synchronousCraftMs:performance.now()-started};world.renderer.domElement.dataset.craftReview=JSON.stringify(craftReview);};
document.querySelector('#motion').onclick=()=>{animating=!animating;};function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;try{if(world){stage={};profile();if(animating)game.combat.elapsed+=dt;if(activeCombat)game.tick(dt);withTowerStatSnapshot(game.data,()=>world.update(game.paused&&!animating?0:dt));if(settling&&[...world.corpses.values()].every(c=>c.userData.death?.settled)){settling=false;game.paused=true;}stageRows.push(stage);if(stageRows.length>120)stageRows.shift();const frameStages=Object.fromEntries(['draw','fields','copies','batches','shares'].map(k=>[k,stageRows.reduce((n,r)=>n+(r[k]||0),0)/stageRows.length]));const r=JSON.parse(world.renderer.domElement.dataset.renderReview||'{}');const loaded=r.defenderCache?.loaded===7&&!r.assetLoads?.running&&!r.assetLoads?.queued&&r.enemyModels?.includes('host_'+document.body.dataset.scene);if(loaded)status.textContent=settling?'Settling corpses':'Scene ready';if(craftTarget){const prepared=world.imported.has(craftTarget+':1');document.querySelector('#craft').disabled=!prepared;status.textContent=craftReview?'Champion ready: '+craftReview.immediateModelStatus:prepared?'Target preloaded before final ingredient':'Preparing target from two visible ingredients';}result.textContent=JSON.stringify({scene:document.body.dataset.scene,activeCombat,craftReview,frameStages,...r},null,2);}}catch(e){status.textContent='ERROR: '+e.message;console.error(e);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
