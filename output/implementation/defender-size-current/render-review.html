<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Current defender size review</title><style>body{margin:0;background:#f6efdd;color:#243b38;font:14px system-ui}header{padding:16px;background:#243b38;color:#f2dfb0;position:sticky;top:0;z-index:2}button,select{padding:7px;margin:3px;font:inherit}.sheet{display:grid;grid-template-columns:repeat(2,480px);gap:10px;padding:12px}.sheet article{border:1px solid #b2a27b;background:#fffaf0}h3{margin:8px;font-size:15px}article p{margin:6px 8px;font-size:11px}img{display:block;width:480px}.formation{width:100%;max-width:1200px;padding:12px}.formation img{width:100%}</style><header><strong>0.6.10 · current defender size review · exact approved models</strong><br><select id="group"></select><select id="pose"><option>Idle</option><option>Attack</option></select><button id="render">Render comparison</button><button id="formation">Adjacent Human defenders</button><p id="status">Ready</p></header><main id="sheet" class="sheet"></main><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import registry from '/data/factions-v060.json';import baseline from '/output/implementation/defender-size-current/baseline-measurements.json';import {loadPackedModel} from '/game/render/packed-model.js';import {installDefenderTemplate,cloneDefenderTemplate,disposeDefenderInstance} from '/game/render/defender-assets.js';import {applyDefenderClassificationScale} from '/game/render/defender-classification-scale.js';import {scaleBattlefieldUnit,BATTLEFIELD_UNIT_SCALE} from '/game/render/battlefield-scale.js';import {attachChampionAura,disposeChampionAura} from '/game/render/champion-aura.js';import {castleWallModel,WALL_DECK_HEIGHT} from '/game/render/walls.js';
const all=registry.factions.flatMap(f=>f.assets),row=e=>baseline.rows.find(r=>r.factionId===e.factionId&&r.family===e.family&&r.tier===e.tier),find=(f,id,tier=1)=>all.find(e=>e.factionId===f&&e.family===id&&e.tier===tier);
const groups=[{label:'Human comparison',entries:[find('crown','soldier'),find('crown','archer',3),find('crown','cleric',3),find('crown','stormcaller',3),find('crown','rimewatch'),find('crown','frostblade'),find('crown','embercrown'),find('crown','greenheart')]},...registry.factions.map(f=>({label:f.name+' Basic champions',entries:f.assets.filter(e=>row(e).classification==='Basic')})),{label:'Higher classes and shared Claire',entries:[find('crown','highking'),find('crown','crownofages'),find('crown','kingsreach'),find('crown','archbishop'),find('forge','dw_grapeshotcart'),find('grove','el_fire_dragon'),find('crown','ladyclaire'),find('forge','ladyclaire')].filter(Boolean)}];
const group=document.querySelector('#group'),pose=document.querySelector('#pose'),status=document.querySelector('#status'),sheet=document.querySelector('#sheet');groups.forEach((g,i)=>group.add(new Option(g.label,i)));
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor('#e7e3d0');
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-2,2,2.08,-2.08,.01,100);camera.position.set(4.5,3.7,6);camera.lookAt(0,1,0);scene.add(new THREE.HemisphereLight(0xffffff,0x81856b,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(512,512);Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5});scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:'#c6c5a7',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(16,16,'#9b9e83','#b2b59a');grid.position.y=.002;scene.add(grid);
const load=async e=>{status.textContent='Loading '+row(e).name;const asset=await loadPackedModel(new GLTFLoader(),e),field={disposed:false,imported:new Map(),models:new Map(),game:{towers:[],data:{towers:{}}}};installDefenderTemplate(field,e,asset.scene,asset.animations);return asset;};
const release=asset=>{const set=new Set();asset.scene.traverse(n=>{if(n.geometry)set.add(n.geometry);if(n.skeleton)set.add(n.skeleton);for(const m of Array.isArray(n.material)?n.material:[n.material])if(m){set.add(m);for(const t of Object.values(m))if(t?.isTexture)set.add(t);}});for(const r of set)r.dispose();};
const actorFor=(asset,e,after)=>{const actor=cloneDefenderTemplate(asset.scene);if(after)applyDefenderClassificationScale(actor,e.family);else actor.scale.multiplyScalar(row(e).previousMultiplier/BATTLEFIELD_UNIT_SCALE);scaleBattlefieldUnit(actor);actor.traverse(n=>{if(n.isMesh)n.castShadow=true;});const mixer=new THREE.AnimationMixer(actor),clip=asset.animations.find(c=>c.name===pose.value);mixer.clipAction(clip).play();mixer.setTime(pose.value==='Idle'?0:clip.duration*.44);return{actor,mixer};};
const releaseActor=({actor,mixer,aura})=>{scene.remove(actor);if(aura)disposeChampionAura(aura);mixer.stopAllAction();mixer.uncacheRoot(actor);disposeDefenderInstance(actor);};
const resetCamera=()=>{Object.assign(camera,{left:-2,right:2,top:2.08,bottom:-2.08});camera.position.set(4.5,3.7,6);camera.lookAt(0,1,0);camera.updateProjectionMatrix();};
document.querySelector('#render').onclick=async()=>{sheet.className='sheet';sheet.replaceChildren();resetCamera();renderer.setSize(240,250);try{for(const e of groups[Number(group.value)].entries){const asset=await load(e),canvas=document.createElement('canvas');canvas.width=480;canvas.height=250;const ctx=canvas.getContext('2d');for(const [i,after]of [false,true].entries()){const value=actorFor(asset,e,after);scene.add(value.actor);renderer.render(scene,camera);ctx.drawImage(renderer.domElement,i*240,0);releaseActor(value);}const article=document.createElement('article'),h=document.createElement('h3'),img=new Image(),p=document.createElement('p');h.textContent=row(e).name+' · '+e.tier+' · '+pose.value;img.src=canvas.toDataURL();img.alt='Before feedback on the left; current size on the right; same camera, lighting and one-tile grid';p.textContent='Before feedback (left) · Current (right) · identical source proportions';article.append(h,img,p);sheet.append(article);release(asset);}status.textContent='Rendered '+groups[Number(group.value)].entries.length+' · '+groups[Number(group.value)].label+' · '+pose.value;}catch(e){status.textContent='ERROR: '+e.message;console.error(e);}};
document.querySelector('#formation').onclick=async()=>{sheet.className='formation';sheet.replaceChildren();status.textContent='Loading adjacent defenders';const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=440;const ctx=canvas.getContext('2d');renderer.setSize(600,440);Object.assign(camera,{left:-3.5,right:3.5,top:2.57,bottom:-2.57});camera.position.set(5,6,7);camera.lookAt(0,.7,0);camera.updateProjectionMatrix();const es=[find('crown','rimewatch'),find('crown','frostblade'),find('crown','embercrown'),find('crown','cleric',3)],assets=[];try{for(const e of es)assets.push(await load(e));for(const [i,after]of [false,true].entries()){const values=[],walls=[];for(let j=0;j<es.length;j++){const value=actorFor(assets[j],es[j],after),x=(j%2-.5)*1.1,z=(Math.floor(j/2)-.5)*1.1;value.actor.position.set(x,WALL_DECK_HEIGHT,z);value.actor.rotation.y=Math.PI;scene.add(value.actor);value.aura=attachChampionAura(value.actor,es[j].family,{phase:j*1.7});values.push(value);const wall=castleWallModel(0,true);wall.position.set(x,0,z);scene.add(wall);walls.push(wall);}renderer.render(scene,camera);ctx.drawImage(renderer.domElement,i*600,0);for(const v of values)releaseActor(v);for(const w of walls)scene.remove(w);}const h=document.createElement('h3'),img=new Image(),p=document.createElement('p');h.textContent='Adjacent Human defenders · same walls and camera';img.src=canvas.toDataURL();img.alt='Four adjacent defenders before and after the size correction';p.textContent='Before feedback (left) · Current (right) · Frostsword Watchmen, Frost Knight, Cinder Adept and Cleric III';sheet.append(h,img,p);status.textContent='Formation ready · same foundations, source models and class aura colours';}catch(e){status.textContent='ERROR: '+e.message;console.error(e);}finally{for(const a of assets)release(a);}};
</script></html>
