<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FR-006 / FR-007 current implementation review</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#f6efdd;color:#283e3b;font:14px system-ui}header{padding:16px;background:#233c3a;color:#f3dfac;position:sticky;top:0;z-index:2}button,select{font:inherit;padding:7px;margin:3px}.sheet{display:grid;grid-template-columns:repeat(2,480px);gap:10px;padding:12px}.sheet article{border:1px solid #a59467;background:#fffaf0}h3{font-size:15px;margin:8px}article p{font-size:11px;margin:5px 8px}img{display:block;width:480px}#result{padding:20px;max-width:840px;margin:auto}.result-stats{display:flex;gap:16px}.result-stats>div{display:flex;flex-direction:column}.run-result-art{max-width:100%}#status{font-size:12px}@media(max-width:700px){.sheet{grid-template-columns:480px}.result-stats{flex-wrap:wrap}}</style></head><body><header><strong>FR-006 / FR-007 · local review · 0.6.10</strong><br><label>Model group <select id="group"></select></label><label>Pose <select id="pose"><option>Idle</option><option>Attack</option></select></label><button id="render">Render exact V3 models</button><button id="outcome">Show results</button><select id="faction"><option value="crown">Human</option><option value="forge">Dwarves</option><option value="grove">Elves</option><option value="legacy">Faction not recorded</option></select><select id="ending"><option value="lost">Defeat</option><option value="won">Victory</option></select><p id="status">Ready</p></header><main id="sheet" class="sheet"></main><main id="result" hidden></main><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {loadPackedModel} from '/game/render/packed-model.js';
import registry from '/data/factions-v060.json';import audit from '/output/design/next-requirement-current/human-size-audit.json';
import {installDefenderTemplate,cloneDefenderTemplate,disposeDefenderInstance} from '/game/render/defender-assets.js';
import {applyDefenderClassificationScale,defenderClassificationMultiplier,defenderPresentationMultiplier} from '/game/render/defender-classification-scale.js';
import {scaleBattlefieldUnit} from '/game/render/battlefield-scale.js';
import {runResultMarkup} from '/ui/run-results.js';import {resultLeaderboardMarkup,resultScoreVersionMarkup} from '/ui/leaderboard.js';import {factionName} from '/game/core/factions.js';
import '/ui/style.css';import '/ui/run-results.css';import '/ui/leaderboard.css';import '/ui/cartographer.css';import '/ui/cartographer-crafted.css';import '/ui/cartographer-refinements.css';import '/ui/outcome-art-v044.css';
const override=document.createElement('style');override.textContent='html,body{overflow:auto!important;height:auto!important}body{background:#f6efdd!important}header{position:sticky!important;top:0!important;z-index:2!important}#result{width:100%;padding:16px;max-width:840px;margin:auto}#sheet img{width:480px}#result img{width:auto;max-width:100%}header button,header select{font-size:13px;color:#222;background:#fff}';document.head.append(override);
const entries=registry.factions[0].assets,group=document.querySelector('#group'),pose=document.querySelector('#pose'),sheet=document.querySelector('#sheet'),result=document.querySelector('#result'),status=document.querySelector('#status');
const groups=[['Draft I–III',entries.filter(e=>audit.rows.find(r=>r.family===e.family&&r.rank===e.tier).classification==='Draft basic'&&e.tier<=3)],['Draft IV–VI',entries.filter(e=>audit.rows.find(r=>r.family===e.family&&r.rank===e.tier).classification==='Draft basic'&&e.tier>3)],...['Basic','Intermediate','Advanced','TOP','Secret'].map(c=>[c,entries.filter(e=>audit.rows.find(r=>r.family===e.family&&r.rank===e.tier).classification===c)])].flatMap(([name,es])=>Array.from({length:Math.ceil(es.length/8)},(_,i)=>({label:name+' · '+(i+1),entries:es.slice(i*8,(i+1)*8)})));
groups.forEach((g,i)=>group.add(new Option(g.label,i)));group.value=String(groups.findIndex(g=>g.label.startsWith('Basic')));
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(240,250);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor('#e7e3d0');
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-2,2,2.08,-2.08,.01,100);camera.position.set(4.5,3.7,6);camera.lookAt(0,1,0);scene.add(new THREE.HemisphereLight(0xffffff,0x81856b,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(512,512);Object.assign(sun.shadow.camera,{left:-4,right:4,top:5,bottom:-4});scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshStandardMaterial({color:'#c6c5a7',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(10,10,'#9b9e83','#b2b59a');grid.position.y=.002;scene.add(grid);
document.querySelector('#render').onclick=async()=>{sheet.hidden=false;result.hidden=true;sheet.replaceChildren();status.textContent='Rendering exact approved models…';try{for(const e of groups[Number(group.value)].entries){
 status.textContent='Loading '+e.family+' · '+e.packedFile;const gltf=await loadPackedModel(new GLTFLoader(),e);const field={disposed:false,imported:new Map(),models:new Map(),game:{towers:[],data:{towers:{}}}};installDefenderTemplate(field,e,gltf.scene,gltf.animations);
 const canvas=document.createElement('canvas');canvas.width=480;canvas.height=250;const ctx=canvas.getContext('2d');
 for(const [i,after]of [false,true].entries()){
  const actor=cloneDefenderTemplate(gltf.scene);if(after)applyDefenderClassificationScale(actor,e.family);else actor.scale.multiplyScalar(defenderClassificationMultiplier(e.family)*defenderPresentationMultiplier(e.family,'crown'));scaleBattlefieldUnit(actor);actor.traverse(n=>{if(n.isMesh)n.castShadow=true;});
  const mixer=new THREE.AnimationMixer(actor),clip=gltf.animations.find(c=>c.name===pose.value);mixer.clipAction(clip).play();mixer.setTime(pose.value==='Idle'?0:clip.duration*.44);scene.add(actor);renderer.render(scene,camera);ctx.drawImage(renderer.domElement,i*240,0);scene.remove(actor);mixer.stopAllAction();mixer.uncacheRoot(actor);disposeDefenderInstance(actor);
 }
 const article=document.createElement('article'),title=document.createElement('h3'),img=new Image(),p=document.createElement('p');title.textContent=audit.rows.find(r=>r.family===e.family&&r.rank===e.tier).name+' · '+e.tier+' · '+pose.value;img.src=canvas.toDataURL();img.alt='Before and after, same camera, lighting and one-tile ground grid';p.textContent='Before 0.6.9 (left) · After 0.6.10 (right) · fixed camera / one-tile grid';article.append(title,img,p);sheet.append(article);
 const resources=new Set();gltf.scene.traverse(n=>{if(n.geometry)resources.add(n.geometry);if(n.skeleton)resources.add(n.skeleton);for(const m of Array.isArray(n.material)?n.material:[n.material])if(m){resources.add(m);for(const t of Object.values(m))if(t?.isTexture)resources.add(t);}});for(const r of resources)r.dispose();
 }status.textContent='Rendered '+groups[Number(group.value)].entries.length+' exact models · '+groups[Number(group.value)].label+' · '+pose.value+' · no source models changed';}catch(e){status.textContent='ERROR: '+e.message;console.error(e);}};
document.querySelector('#outcome').onclick=()=>{sheet.hidden=true;result.hidden=false;const factionId=document.querySelector('#faction').value,won=document.querySelector('#ending').value==='won';const model={ended:true,won,factionId:factionId==='legacy'?null:factionId,factionName:factionName(factionId),score:462080,kills:1290,elapsedSeconds:6543,completedWaves:won?50:49,wave:50,waveLimit:50,defeatWave:50};result.innerHTML=runResultMarkup(model,{scoreVersionMarkup:resultScoreVersionMarkup({},{version:'0.6.10',factionId:model.factionId}),leaderboardMarkup:resultLeaderboardMarkup({version:'0.6.10',factionId:model.factionId,mode:50})});status.textContent='Local fixture · no scores submitted · '+model.factionName+' · '+(won?'Victory':'Defeat');};
</script></body></html>
