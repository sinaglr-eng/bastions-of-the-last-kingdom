<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5ebd4" />
    <meta name="description" content="Forged Alliances TD. Draft defenders, forge champion alliances, and shape a maze against fifty fantasy warbands." />
    <title>Forged Alliances TD</title>
    <link rel="icon" href="%BASE_URL%favicon.svg?v=forged-alliances-v1" type="image/svg+xml" />
    <style>
      html,body{margin:0;background:#f8efde}
      #app>.loading.forged-loading{min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;padding:32px;background:radial-gradient(ellipse at 50% 45%,#fffaf1,#f1e4cc);color:#705027;text-align:center}
      .forged-loading img{display:block;width:min(560px,88vw);height:auto}
      .forged-loading p{margin:0;font:clamp(18px,3vw,25px)/1.4 Georgia,serif;letter-spacing:.03em}
      .forged-loading:after{content:'';display:block;width:70px;height:2px;background:linear-gradient(90deg,transparent,#b68c46,transparent)}
    </style>
  </head>
  <body>
    <main id="app"><div class="loading forged-loading" role="status" aria-live="polite"><img src="%BASE_URL%assets/branding/forged-alliances-v3/wordmark.svg" width="650" height="160" alt="Forged Alliances TD" /><p>Raising the banners&#8230;</p></div></main>
    <script type="module" src="/game/main.js"></script>
  </body>
</html>
